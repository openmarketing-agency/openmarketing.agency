name: Release OMA

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installer:
    if: github.repository == 'openmarketing-agency/openmarketing.agency' && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Publish the native Debian installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          package="oma-setup-$GITHUB_REF_NAME-debian-amd64"
          read_version() {
            awk -v key="$1" '
              $0 ~ "^" key ":" {
                sub(/^[^:]*:[[:space:]]*/, "")
                sub(/[[:space:]]*#.*$/, "")
                sub(/[[:space:]]+$/, "")
                print
                exit
              }
            ' setup/versions.yaml
          }
          bash -n setup/install.sh
          [[ "$(read_version oma-server)" == "$GITHUB_REF_NAME" ]] \
            || { printf 'setup/versions.yaml oma-server (%s) must match release tag %s\n' "$(read_version oma-server)" "$GITHUB_REF_NAME" >&2; exit 1; }
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage/$package"
          cp -a setup "$stage/$package/"
          cp LICENSE "$stage/$package/"
          tar -C "$stage" -czf "$package.tar.gz" "$package"
          sha256sum "$package.tar.gz" > SHA256SUMS
          {
            printf 'Native Debian installer: `%s.tar.gz` (installs oma-agent and omactl natively, then runs the console and Camofox containers with Docker; contains the `setup/` directory)\n\n' "$package"
            printf 'Pinned versions from `setup/versions.yaml`:\n'
            printf -- '- console (oma-server): `%s`\n' "$(read_version oma-server)"
            printf -- '- omactl: `%s`\n' "$(read_version omactl)"
            printf -- '- oma-agent: `%s`\n' "$(read_version oma-agent)"
            printf -- '- camofox image: `%s`\n' "$(read_version camofox_image)"
          } > "$RUNNER_TEMP/oma-release.md"
          cat "$RUNNER_TEMP/oma-release.md" >> "$GITHUB_STEP_SUMMARY"
          gh release create "$GITHUB_REF_NAME" "$package.tar.gz" SHA256SUMS \
            --verify-tag --title "OMA $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/oma-release.md"

  oma-server:
    if: github.repository == 'openmarketing-agency/openmarketing.agency' && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REPOSITORY: ghcr.io/openmarketing-agency/oma-server
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build and publish oma-server
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          image="$IMAGE_REPOSITORY:$GITHUB_REF_NAME"
          docker build --platform linux/amd64 --target oma-runtime \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$image" .
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$image"
          printf 'Next.js server image: `%s`\n' "$image" >> "$GITHUB_STEP_SUMMARY"

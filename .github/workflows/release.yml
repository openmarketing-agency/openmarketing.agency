name: Release OMA VM

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'openmarketing-agency/openmarketing.agency' && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      IMAGE_REPOSITORY: ghcr.io/openmarketing-agency/openmarketing.agency
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build and smoke-test the release images
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          docker build --platform linux/amd64 -f vm/Dockerfile \
            --build-arg "OMA_VM_VERSION=$GITHUB_REF_NAME" --build-arg "OMA_SOURCE_COMMIT=$GITHUB_SHA" \
            -t "$IMAGE_REPOSITORY/oma-vm:$GITHUB_REF_NAME" .
          OMA_TEST_CATALOG=1 bash vm/tests/smoke.sh "$IMAGE_REPOSITORY/oma-vm:$GITHUB_REF_NAME"
          docker build --platform linux/amd64 --target oma-runtime \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t "$IMAGE_REPOSITORY:$GITHUB_REF_NAME" .

      - name: Verify the full release stack starts
        env:
          OPENROUTER_API_KEY: release-smoke-test-key
        run: |
          export OMA_RELEASE_TAG="$GITHUB_REF_NAME"
          compose() {
            docker compose -p oma-release-smoke -f compose.yaml -f compose.vm.yaml -f vm/compose.release.yaml "$@"
          }
          trap 'compose down --volumes' EXIT
          compose up --detach --no-build --pull missing --wait --wait-timeout 1200
          compose exec -T --user hermes vm omactl status --json

      - name: Publish images and the bare-metal installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          console="$IMAGE_REPOSITORY:$GITHUB_REF_NAME"
          vm="$IMAGE_REPOSITORY/oma-vm:$GITHUB_REF_NAME"
          docker push "$console"
          docker push "$vm"

          package="oma-vm-$GITHUB_REF_NAME-linux-amd64"
          mkdir -p "$RUNNER_TEMP/$package"
          cp compose.yaml compose.vm.yaml .env.example LICENSE vm/compose.release.yaml vm/install.sh "$RUNNER_TEMP/$package/"
          printf '%s\n' "$GITHUB_REF_NAME" > "$RUNNER_TEMP/$package/VERSION"
          tar -C "$RUNNER_TEMP" -czf "$package.tar.gz" "$package"
          sha256sum "$package.tar.gz" > SHA256SUMS
          digest=$(docker image inspect "$vm" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep -F "$IMAGE_REPOSITORY/oma-vm@sha256:")
          printf 'VM image for Agent37: `%s`\n\nConsole image: `%s`\n' "$digest" "$console" > "$RUNNER_TEMP/oma-release.md"
          cat "$RUNNER_TEMP/oma-release.md" >> "$GITHUB_STEP_SUMMARY"
          gh release create "$GITHUB_REF_NAME" "$package.tar.gz" SHA256SUMS \
            --verify-tag --title "OMA $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/oma-release.md"

# Validate the self-hosted app and SQLite behavior on a fresh checkout.
name: OMA CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oma
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate Docker Compose
        working-directory: .
        env:
          OPENROUTER_API_KEY: compose-config-test
        run: |
          set -o pipefail
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.vm.yaml config --quiet
          HERMES_HOME=/var/lib/oma-agent docker compose -f compose.yaml -f compose.vm.yaml config --format json |
            jq -e '.services.vm | .environment.HERMES_HOME == "/var/lib/oma-agent" and any(.volumes[]; .source == "vm-data" and .target == "/var/lib/oma-agent")'
          docker compose -f compose.yaml -f compose.vm.yaml -f compose.dev.yaml config --quiet
          CAMOFOX_API_KEY=compose-config-test docker compose -f compose.yaml -f compose.vm.yaml -f compose.camofox.yaml config --quiet

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: oma/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: node tests/console-routing.smoke.mjs
      - run: node tests/console-routing.smoke.mjs --dev

  stack-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - run: bash -n .github/scripts/check-release.sh
      - run: bun test --timeout 15000 tests/stack
      - name: Verify the stack release archive
        run: |
          release_version=0.1.0
          assets="$RUNNER_TEMP/release-assets"
          bash .github/scripts/package-release.sh "$release_version" "$assets"
          (
            cd "$assets"
            sha256sum -c SHA256SUMS
            setup_package="oma-setup-v$release_version-linux-amd64"
            tar -xzf "$setup_package.tar.gz"
            cmp versions.yaml "$setup_package/setup/versions.yaml"
            bash -n "$setup_package/setup/install.sh"
            for file in workspace.py campaign_activity.py custom_mcp.py sync_standalone.py; do
              cmp "$GITHUB_WORKSPACE/vm/$file" "$setup_package/setup/$file"
            done
            test ! -e "$setup_package/setup/oma"
          )

  vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: docker build --platform linux/amd64 -f vm/Dockerfile -t oma-vm:test .
      - run: bash vm/tests/smoke.sh oma-vm:test

name: OMA CLI

on:
  pull_request:
    paths: ['oma-cli/**', '.github/workflows/oma-cli.yml', '.github/scripts/update-r2-version-index.py']
  push:
    branches: [main]
    paths: ['oma-cli/**', '.github/workflows/oma-cli.yml', '.github/scripts/update-r2-version-index.py']
    tags: ['oma-cli-v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: oma-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: '!github.event.deleted'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Validate, test, and build
        working-directory: oma-cli
        env:
          OMA_R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
        run: |
          version=$(bun -p 'require("./package.json").version')
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "oma-cli-v$version" ]]; then
            printf 'Tag %s does not match CLI version %s in oma-cli/package.json.\n' "$GITHUB_REF_NAME" "$version" >&2
            exit 1
          fi
          bun install --frozen-lockfile
          bun run typecheck
          bun test
          bun run build
          test "$(dist/oma --version)" = "$version"
          dist/oma cli status --output json
          assets="$RUNNER_TEMP/cli-assets"
          bash scripts/package-release.sh "$version" "$assets"
          (cd "$assets" && sha256sum -c SHA256SUMS)
          printf '{"version":"%s"}\n' "$version" > "$assets/version.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.ref_type == 'tag'
        with:
          name: oma-cli-release
          path: ${{ runner.temp }}/cli-assets/*
          if-no-files-found: error

  publish:
    if: github.repository == 'openmarketing-agency/openmarketing.agency' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: oma-cli-release
          path: assets
      - name: Publish the standalone CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -er '.version' assets/version.json)
          [[ $GITHUB_REF_NAME == "oma-cli-v$version" && $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          (cd assets && sha256sum -c SHA256SUMS)
          printf '==> Publishing OMA CLI v%s\n' "$version" >&2
          gh release create "$GITHUB_REF_NAME" "assets/oma-cli-v$version-linux-amd64.tar.gz" assets/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --latest=false --title "OMA CLI v$version" \
            --notes 'Download the Linux AMD64 archive and SHA256SUMS, verify the checksum, extract it, and install the oma binary at /usr/local/bin/oma. No stack manifest is needed.'

  catalog:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: oma-cli-release
          path: assets
      - name: Publish CLI version metadata and catalog to OMA R2
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          : "${R2_BUCKET:?Configure R2_BUCKET}" "${R2_ACCOUNT_ID:?Configure R2_ACCOUNT_ID}" \
            "${AWS_ACCESS_KEY_ID:?Configure R2_ACCESS_KEY_ID}" "${AWS_SECRET_ACCESS_KEY:?Configure R2_SECRET_ACCESS_KEY}"
          version=$(jq -er '.version' assets/version.json)
          [[ $GITHUB_REF_NAME == "oma-cli-v$version" && $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          key="oma-cli/versions/$version.json"
          printf '==> Mirroring %s to OMA R2\n' "$key" >&2
          aws s3 cp assets/version.json "s3://$R2_BUCKET/$key" --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --content-type application/json --only-show-errors
          python3 .github/scripts/update-r2-version-index.py oma-cli/versions/index.json "$version"

# Browser sidecar included by make dev. For direct Compose use, supply CAMOFOX_API_KEY.
services:
  camofox:
    image: ghcr.io/jo-inc/camofox-browser@sha256:49f8e02f9fb0e191b406845482745efc72f835db06789e3a34e77a6ff1497046
    init: true
    restart: unless-stopped
    shm_size: 512m
    environment:
      CAMOFOX_API_KEY: ${CAMOFOX_API_KEY:?Set CAMOFOX_API_KEY in a private environment file}
      CAMOFOX_ACCESS_KEY: ${CAMOFOX_API_KEY:?Set CAMOFOX_API_KEY in a private environment file}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9377/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 45s
  vm:
    depends_on:
      camofox:
        condition: service_healthy
    environment:
      CAMOFOX_URL: http://camofox:9377
      CAMOFOX_API_KEY: ${CAMOFOX_API_KEY:?Set CAMOFOX_API_KEY in a private environment file}

services:
  app:
    group_add:
      - "10000"
    volumes:
      - console-gateway-key:/run/oma-console:ro
    environment:
      OMA_AGENT_URL: ${OMA_AGENT_URL:-http://vm:8642}
      OMA_AGENT_API_KEY_FILE: /run/oma-console/gateway.key
      OMA_CAMPAIGN_GATEWAY_URL: http://vm:8642
      OMA_CAMPAIGN_KEY_DIR: /run/oma-console

  vm:
    platform: linux/amd64
    build:
      context: .
      dockerfile: vm/Dockerfile
    privileged: true
    restart: unless-stopped
    stop_grace_period: 45s
    ports:
      - "127.0.0.1:${OMA_GATEWAY_PORT:-8642}:8642"
      - "127.0.0.1:${OMA_DASHBOARD_PORT:-9119}:9119"
      - "127.0.0.1:${OMA_CATALOG_PORT:-18080}:9080"
    volumes:
      - vm-data:/opt/data
      - console-gateway-key:/run/oma-console
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?Set OPENROUTER_API_KEY in your environment file}
      OMA_HERMES_MODEL: ${OMA_HERMES_MODEL:-openai/gpt-4.1-mini}
      OMA_HERMES_GATEWAY_SEED: ${OMA_HERMES_GATEWAY_SEED:-}
      OMA_INIT_CATALOG: ${OMA_INIT_CATALOG:-1}
      OMA_EXPORT_CONSOLE_GATEWAY_KEY: '1'
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-m", "2", "-o", "/dev/null", "http://127.0.0.1:8642/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 120s

volumes:
  vm-data:
  console-gateway-key:

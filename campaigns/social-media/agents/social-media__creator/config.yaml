# OMA metadata; this canonical ID is the deployed Hermes profile name.
id: social-media__creator
description: Create original platform-appropriate social copy, captions, scripts, and available media assets from the assigned brief and brand voice; deliver editable drafts without publishing or interacting.
version: 0.1.0

# OMA cron job declarations; provisioning tooling is planned (see JOBS.md).
jobs: []

agent:
  enabled_toolsets:
    - file
    - web
    - memory
    - skills
    - kanban

# Approval policy: approvals are off in every mode, so cron, single-query and
# unattended surfaces auto-approve instead of the native smart/deny defaults.
approvals:
  mode: off
  cron_mode: approve
  single_query_mode: approve
  unattended_mode: approve
  # Any admitted member may answer an approval prompt or slash confirmation.
  approvers: ["*"]
  # Skip the /reload-mcp and /clear|/new|/reset|/undo confirmations.
  mcp_reload_confirm: false
  destructive_slash_confirm: false

tools:
  tool_search:
    enabled: "auto"
    eager_toolsets: []

# No additional skill dependency is declared; role guidance lives in SOUL.md.
skills:
  disabled:
    - computer-use
    - hermes-agent
oma_skills: []

# Media-generation tools, licenses, and spend permissions must be provisioned
# explicitly; this base definition does not itself enable image/video generation.

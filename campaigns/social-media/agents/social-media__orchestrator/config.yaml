# Canonical agent ID is also the deployed Hermes profile name; do not prefix twice.
# id, description, version, and oma_skills are OMA source metadata.
id: social-media__orchestrator
description: Grow the connected social accounts through evidence-backed content, useful community interaction, performance review, and dynamically assigned specialist work within standing authority.
version: 0.1.0


cron:
  max_parallel_jobs: 1

# OMA cron job declarations; provisioning tooling is planned (see JOBS.md).
jobs:
  - id: maintain-social-media
    name: Maintain the social media mission
    schedule: "every 10m"
    prompt: >-
      Act as this playbook's orchestrator and pursue your standing social media
      goal of relevant reach, audience trust, meaningful engagement, and
      business outcomes for the authorized connected accounts. Read your SOUL,
      deployment objectives, current Kanban board, previous handoffs, and
      available account evidence. Honor pause and stop state. Review progress
      and dynamically choose useful research, content creation, publication,
      or community work through the resolved specialist roster. Reconcile
      existing tasks and the interactor's scheduled activity before assigning
      work so posts, replies, and planning are not duplicated. Act within
      standing authority and record decisions and durable handoffs. If no
      action is justified, remain silent and end this bounded run; do not wait
      in a loop or create another recurring schedule.
    repeat: null

# Deployment supplies models, credentials, account bindings, and enforced policy.
# Add only authorized integration toolsets to each owning profile's allowlist.
agent:
  enabled_toolsets:
    - file
    - browser
    - web
    - memory
    - skills
    - kanban

# Approval policy: approvals are off in every mode, so cron, single-query and
# unattended surfaces auto-approve instead of the native smart/deny defaults.
approvals:
  mode: off
  cron_mode: approve
  single_query_mode: approve
  unattended_mode: approve
  # Any admitted member may answer an approval prompt or slash confirmation.
  approvers: ["*"]
  # Skip the /reload-mcp and /clear|/new|/reset|/undo confirmations.
  mcp_reload_confirm: false
  destructive_slash_confirm: false

tools:
  tool_search:
    enabled: "auto"
    eager_toolsets: []

skills:
  disabled:
    - computer-use
    - hermes-agent
oma_skills:
  - playbook-orchestration

kanban:
  auto_decompose: false
  # Canonical IDs already match Hermes profile names; deploy these references unchanged.
  orchestrator_profile: social-media__orchestrator
  auto_subscribe_on_create: true
  notify_in_gateway: true
  dispatch_in_gateway: true
  review_dispatch: false
  max_in_progress: 3
  max_in_progress_per_profile: 1
  dispatch_profiles:
    - social-media__researcher
    - social-media__creator
    - social-media__publisher
    - social-media__interactor

# Bootstrap installs declared skills, binds the board and profile roster, and
# establishes the canonical coordinator session and authorized review wake-ups.

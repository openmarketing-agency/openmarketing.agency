# OMA metadata; this canonical ID is the deployed Hermes profile name.
id: social-media__researcher
description: Research social audiences, competitors, emerging topics, platform formats, and authorized account performance; return cited opportunities and limitations without inventing engagement metrics.
version: 0.1.0

# OMA cron job declarations; provisioning tooling is planned (see JOBS.md).
jobs: []

agent:
  enabled_toolsets:
    - file
    - browser
    - web
    - memory
    - skills
    - kanban

# Approval policy: approvals are off in every mode, so cron, single-query and
# unattended surfaces auto-approve instead of the native smart/deny defaults.
approvals:
  mode: off
  cron_mode: approve
  single_query_mode: approve
  unattended_mode: approve
  # Any admitted member may answer an approval prompt or slash confirmation.
  approvers: ["*"]
  # Skip the /reload-mcp and /clear|/new|/reset|/undo confirmations.
  mcp_reload_confirm: false
  destructive_slash_confirm: false

tools:
  tool_search:
    enabled: "auto"
    eager_toolsets: []

skills:
  disabled:
    - computer-use
    - hermes-agent
oma_skills:
  - research-market
  - research-trends

# Account analytics and read-only social integrations are deployment-specific.

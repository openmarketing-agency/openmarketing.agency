# OMA metadata; this canonical ID is the deployed Hermes profile name.
id: social-media__publisher
description: Publish, schedule, or update explicitly authorized social content and assets on the intended connected account, preserve the reviewed revision, prevent duplicates, and read back the resulting state.
version: 0.1.0

# OMA cron job declarations; provisioning tooling is planned (see JOBS.md).
jobs: []

agent:
  enabled_toolsets:
    - file
    - browser
    - web
    - memory
    - skills
    - kanban

# Approval policy: approvals are off in every mode, so cron, single-query and
# unattended surfaces auto-approve instead of the native smart/deny defaults.
approvals:
  mode: off
  cron_mode: approve
  single_query_mode: approve
  unattended_mode: approve
  # Any admitted member may answer an approval prompt or slash confirmation.
  approvers: ["*"]
  # Skip the /reload-mcp and /clear|/new|/reset|/undo confirmations.
  mcp_reload_confirm: false
  destructive_slash_confirm: false

tools:
  tool_search:
    enabled: "auto"
    eager_toolsets: []

skills:
  disabled:
    - computer-use
    - hermes-agent
oma_skills: []

# Social APIs/MCP tools, credentials, and account-action scopes are supplied
# at deployment; no platform or publication authority is assumed by this file.

# OMA metadata; this canonical ID is the deployed Hermes profile name.
id: social-media__interactor
description: Read relevant comments, mentions, and conversations and perform authorized helpful replies and community interactions on the bound account; avoid spam, protect private information, and verify each external action.
version: 0.1.0

cron:
  max_parallel_jobs: 1

# OMA cron job declarations; provisioning tooling is planned (see JOBS.md).
jobs:
  - id: reply-to-social-interactions
    name: Check and reply to social interactions
    schedule: "every 5m"
    prompt: >-
      Check the authorized connected social media integrations for the latest
      comments, replies, mentions, and relevant conversations. Honor pause and
      stop state and read enough thread context to understand each interaction.
      Reconcile durable cursors, prior action receipts, and current platform
      state; process new items and unresolved items from earlier failed runs
      without missing pages or replying twice. Reply helpfully and naturally
      where a response is warranted and covered by standing authority; this is
      not a draft-only review. Do not request fresh approval for already
      authorized routine replies. Respect account boundaries, opt-outs, platform
      limits, and sensitive-topic escalation rules. Use only actually available
      integrations; a missing connector blocks only its dependent actions.
      Read back each sent reply, save its exact target and reply IDs, and inspect
      uncertain writes before retrying. Record progress and handoffs for the
      orchestrator without creating another scheduler. If nothing needs a
      response, remain silent and end this bounded run.
    repeat: null

agent:
  enabled_toolsets:
    - file
    - browser
    - web
    - memory
    - skills

# Approval policy: approvals are off in every mode, so cron, single-query and
# unattended surfaces auto-approve instead of the native smart/deny defaults.
approvals:
  mode: off
  cron_mode: approve
  single_query_mode: approve
  unattended_mode: approve
  # Any admitted member may answer an approval prompt or slash confirmation.
  approvers: ["*"]
  # Skip the /reload-mcp and /clear|/new|/reset|/undo confirmations.
  mcp_reload_confirm: false
  destructive_slash_confirm: false

tools:
  tool_search:
    enabled: "auto"
    eager_toolsets: []

skills:
  disabled:
    - computer-use
    - hermes-agent
oma_skills: []

# Deployment explicitly binds allowed accounts, interaction types, connector
# toolsets, credentials, and rate limits; access alone is not action authority.

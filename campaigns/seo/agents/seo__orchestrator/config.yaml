# Canonical agent ID is also the deployed Hermes profile name; do not prefix twice.
# id, description, version, and oma_skills are OMA source metadata, not native settings.
id: seo__orchestrator
description: Continuously improve the connected site's SEO by autonomously researching trends and keywords, reviewing Search Console performance, implementing permitted improvements, and measuring results.
version: 0.1.0

cron:
  max_parallel_jobs: 1

# OMA cron job declarations; provisioning tooling is planned (see JOBS.md).
jobs:
  - id: maintain-seo
    name: Maintain the SEO mission
    schedule: "every 10m"
    prompt: >-
      Act as this playbook's orchestrator and pursue your standing goal of
      maintaining and improving the connected site's SEO. Read your SOUL,
      deployment objectives, current Kanban board, previous handoffs, and
      available performance evidence. Honor pause and stop state. Review
      progress, discover justified opportunities, and create or advance useful
      work through the resolved specialist roster within standing authority.
      Check existing work before creating tasks, avoid competing or duplicate
      work, and let evidence determine the next steps rather than following a
      fixed pipeline. Record decisions and durable handoffs. If no action is
      justified, remain silent and end this bounded run; do not wait in a loop
      or create another recurring schedule.
    repeat: null

# SOUL.md states the standing goal; auto-loaded skills define its operating procedure.
# Bootstrap supplies deployment-specific objectives, binds the target site and
# integrations, and enforces the resolved action policy before activating work.
# Model, inference endpoint, credentials, and integration bindings are supplied at deployment.
agent:
  # This is the base capability ceiling. Provisioning must explicitly add each
  # authorized integration toolset (e.g. Search Console/CMS) to the owning profile's
  # resolved allowlist; connecting an integration alone does not enable its tools.
  enabled_toolsets:
    - file
    - browser
    - web
    - memory
    - skills
    - kanban

# Disclosure does not grant additional tools.
# Approval policy: approvals are off in every mode, so cron, single-query and
# unattended surfaces auto-approve instead of the native smart/deny defaults.
approvals:
  mode: off
  cron_mode: approve
  single_query_mode: approve
  unattended_mode: approve
  # Any admitted member may answer an approval prompt or slash confirmation.
  approvers: ["*"]
  # Skip the /reload-mcp and /clear|/new|/reset|/undo confirmations.
  mcp_reload_confirm: false
  destructive_slash_confirm: false

tools:
  tool_search:
    enabled: "auto"
    eager_toolsets: []

skills:
  disabled:
    - computer-use
    - hermes-agent

oma_skills:
  - playbook-orchestration
  - seo-coordination

kanban:
  # The coordinator's own skills govern planning, not the auxiliary decomposer.
  auto_decompose: false
  orchestrator_profile: seo__orchestrator
  auto_subscribe_on_create: true
  notify_in_gateway: true
  dispatch_in_gateway: true
  # SEO verification is an explicitly assigned task, not the bundled SDLC review lane.
  review_dispatch: false
  max_in_progress: 3
  max_in_progress_per_profile: 1
  dispatch_profiles:
    - seo__researcher
    - seo__writer
    - seo__humanizer
    - seo__verifier
    - seo__publisher

# Kanban is the specialist route; profile-routed short delegation is not required.
# Bootstrap must install the skills, bind the shared board and specialist profiles,
# and establish the canonical coordinator session and policy-selected heartbeat.

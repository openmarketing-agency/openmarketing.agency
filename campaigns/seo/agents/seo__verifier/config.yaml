id: seo__verifier
description: Independently verify the assigned content revision and its assets for supported claims, working references, correct presentation, accessibility, and documented usage rights; report blockers and unverified items.
version: 0.1.0

# OMA cron job declarations; provisioning tooling is planned (see JOBS.md).
jobs: []

agent:
  enabled_toolsets:
    - file
    - web
    - browser
    - vision
    - memory
    - skills

# Approval policy: approvals are off in every mode, so cron, single-query and
# unattended surfaces auto-approve instead of the native smart/deny defaults.
approvals:
  mode: off
  cron_mode: approve
  single_query_mode: approve
  unattended_mode: approve
  # Any admitted member may answer an approval prompt or slash confirmation.
  approvers: ["*"]
  # Skip the /reload-mcp and /clear|/new|/reset|/undo confirmations.
  mcp_reload_confirm: false
  destructive_slash_confirm: false

tool_search:
  eager_toolsets: []

# Role instructions are in SOUL.md; no additional skill dependency is declared.
skills:
  disabled:
    - computer-use
    - hermes-agent
oma_skills: []

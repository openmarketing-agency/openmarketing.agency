services:
  app:
    platform: linux/amd64
    image: ghcr.io/openmarketing-agency/openmarketing.agency:${OMA_RELEASE_TAG:?Missing package version}
    volumes: !override
      - console-data:/app/data
      - console-gateway-key:/run/oma-console:ro
  vm:
    platform: linux/amd64
    image: ghcr.io/openmarketing-agency/openmarketing.agency/oma-vm:${OMA_RELEASE_TAG:?Missing package version}

volumes:
  console-data:

# Run the self-hosted Next.js workspace with SQLite in the project data folder.
name: oma-local
x-oma-bind-address: &oma-bind-address ${OMA_BIND_ADDRESS:-127.0.0.1}

services:
  app:
    build:
      context: .
      target: oma-runtime
    init: true
    restart: unless-stopped
    ports:
      - host_ip: *oma-bind-address
        published: "${OMA_FRONTEND_PORT:-3000}"
        target: 3000
    volumes:
      - type: bind
        source: ./.oma-data
        target: /app/data
        bind:
          create_host_path: false
    environment:
      OMA_DATA_DIR: /app/data
      OMA_BIND_ADDRESS: *oma-bind-address
      OMA_ENVIRONMENT: production
      OMA_APP_URL: ${OMA_APP_URL:-http://localhost:${OMA_FRONTEND_PORT:-3000}}
      OMA_FRONTEND_PORT: ${OMA_FRONTEND_PORT:-3000}
      OMA_COOKIE_SECURE: ${OMA_COOKIE_SECURE:-false}
      OMA_SECRET_KEY: ${OMA_SECRET_KEY:-}
      OMA_REFRESH_SECRET_KEY: ${OMA_REFRESH_SECRET_KEY:-}
      OMA_INTEGRATION_ENCRYPTION_KEY: ${OMA_INTEGRATION_ENCRYPTION_KEY:-}
      OMA_REGISTRATION_ENABLED: ${OMA_REGISTRATION_ENABLED:-true}
      OMA_CORS_ORIGINS: ${OMA_CORS_ORIGINS:-[]}
      OMA_DOCS_ENABLED: ${OMA_DOCS_ENABLED:-true}
      COMPOSIO_API_KEY: ${COMPOSIO_API_KEY:-}
      OMA_AGENT_URL: ${OMA_AGENT_URL:-}
      OMA_AGENT_API_KEY: ${OMA_AGENT_API_KEY:-}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
